pipeline:
  name: ots_cevovod_demo
  identifier: ots_cevovod_demo
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: ghconnector
        repoName: ZimskaSola2024
        build: <+input>
  stages:
    - parallel:
        - stage:
            name: Build backend
            identifier: Build_backend
            description: ""
            type: CI
            spec:
              cloneCodebase: true
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Run_1
                      identifier: Run_1
                      spec:
                        connectorRef: account.harnessImage
                        image: alpine/java:20-jdk
                        shell: Bash
                        command: |-
                          cd backend
                          ./mvnw -B package --file pom.xml -DskipTests
        - stage:
            name: build frontend
            identifier: build_frontend
            description: ""
            type: CI
            spec:
              cloneCodebase: true
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: Run
                      name: Run_fe_build
                      identifier: Run_fe_build
                      spec:
                        shell: Bash
                        command: |-
                          cd frontend
                          npm run build
    - stage:
        name: test backend
        identifier: test_backend
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: RunTests
                  name: RunTests_1
                  identifier: RunTests_1
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine/java:20-jdk
                    language: Java
                    buildTool: Maven
                    args: clean test
                    runOnlySelectedTests: true
                    preCommand: cd backend
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - reports.xml
                    enableTestSplitting: false
